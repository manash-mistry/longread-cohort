[project]
name = "longread-cohort"
version = "0.0.1"
description = "Cohort-level interpretation and annotation engine for long-read somatic cancer sequencing data"
requires-python = ">=3.12"
dependencies = ["pandas"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
